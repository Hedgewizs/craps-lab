<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craps Lab — Gear & Merch</title>
<meta name="description" content="Practice gear I actually recommend: precision dice, craps felt layouts, honest gambling-math books. Plus Craps Lab merch (coming soon).">
<link rel="stylesheet" href="styles.css">
<script src="i18n.js"></script>
<script>
/* ---------- Amazon Associates ---------- */
const AMAZON_TAG = "hedgewiz00-20";
const amz = q => "https://www.amazon.com/s?k="+encodeURIComponent(q)+"&tag="+AMAZON_TAG;
const OL = "https://covers.openlibrary.org/b/";
const BOOKS = [
  {cover: OL+"isbn/9780929712079-L.jpg", q:"Gambling 102 Michael Shackleford",
   icon:"📖",
   name:{en:"Gambling 102", zh:"《Gambling 102》"},
   author:{en:"Michael Shackleford", zh:"Michael Shackleford"},
   d:{en:"Written by the Wizard of Odds himself. Shackleford works through every major casino game with real math — house edges, optimal strategy, and honest verdicts on betting systems. No hype, no \u2018secret methods,\u2019 just probability. If you read one gambling book, make it this one.",
      zh:"由 Wizard of Odds 親自撰寫。Shackleford 用真實數學剖析各大賭場遊戲——賭場優勢、最佳策略，以及對投注系統的誠實評價。沒有炒作、沒有「秘密必勝法」，只有機率。只讀一本賭博書的話，就讀這本。"}},
  {cover: OL+"isbn/9780809045990-L.jpg", q:"Fortune's Formula William Poundstone",
   icon:"📖",
   name:{en:"Fortune's Formula", zh:"《Fortune's Formula》"},
   author:{en:"William Poundstone", zh:"William Poundstone"},
   d:{en:"The story of the Kelly criterion — how a Bell Labs scientist's formula for beating the house became the math behind smart bet sizing, from blackjack to Wall Street. Reads like a thriller, teaches like a textbook. Essential for understanding why bankroll management matters more than picking winners.",
      zh:"凱利公式的故事——一位貝爾實驗室科學家擊敗賭場的公式，如何成為從二十一點到華爾街的聰明注碼數學。讀起來像驚悚小說，教得像教科書。想理解為什麼資金管理比選贏家更重要，這本必讀。"}},
  {cover: OL+"isbn/9780123749406-L.jpg", q:"Theory of Gambling and Statistical Logic Epstein",
   icon:"📖",
   name:{en:"The Theory of Gambling and Statistical Logic", zh:"《賭博理論與統計邏輯》"},
   author:{en:"Richard A. Epstein", zh:"Richard A. Epstein"},
   d:{en:"The textbook. Epstein builds probability theory entirely around casino games — dice, cards, roulette — from first principles to advanced analysis. Dense and demanding, but it's the foundation everything on this site stands on. For readers who want the real math, not the simplified version.",
      zh:"教科書級鉅著。Epstein 完全圍繞賭場遊戲——骰子、紙牌、輪盤——從第一原理講到高階分析，建構整套機率論。艱深但紮實，是本站所有內容的真正地基。想學真數學而非簡化版的讀者必讀。"}},
];
const GEAR_ITEMS = [
  {icon:"🎲", q:"precision casino dice set",
   name:{en:"Precision casino dice", zh:"精密賭場骰子"},
   d:{en:"Real casino dice are machined to 1/10,000th of an inch with sharp edges — the only fair way to practice rolls at home. Avoid rounded-corner \u2018poker dice\u2019.",
      zh:"真正的賭場骰子精密切割到萬分之一英吋、邊角銳利——在家練習擲骰唯一公平的選擇。別買圓角的撲克骰子。"}},
  {icon:"🟢", q:"craps table felt layout",
   name:{en:"Craps table felt layout", zh:"花旗骰桌布"},
   d:{en:"A full-size felt with the real betting layout. Learn where every bet lives before your first live table — the Practice trainer pairs perfectly with one.",
      zh:"印有真實下注區的全尺寸桌布。上真桌之前先搞懂每個注的位置——配本站的練習教練效果加倍。"}},
  {icon:"📦", q:"leather dice tray",
   name:{en:"Dice tray", zh:"骰盅托盤"},
   d:{en:"Keeps practice rolls on the table and off the floor. Any tray works — felt-lined is quieter.",
      zh:"讓練習擲骰乖乖待在桌上不掉地板。任何托盤都行——絨面內裡比較安靜。"}},
];
/* ---------- Printify merch (designs come later) ----------
   Fill MERCH_PRODUCTS when designs are ready. Format per item:
   {name:{en:"Craps Lab Tee", zh:"Craps Lab T 恤"}, price:"$24.99",
    img:"https://…/design.jpg", url:"https://hedgewiz.printify.me/product/…"} */
const MERCH_PRODUCTS = [];

Object.assign(I18N.en,{
  gear_title:"Gear & Merch",
  gear_intro:"The practice gear I actually recommend, and Craps Lab merch when it lands. No casino or sportsbook affiliates here — licensing risk I don't need, and you shouldn't trust a 'strategy site' paid by the house anyway.",
  gear_h:"Practice gear",
  gear_d:"Hand-picked. Every item below is something I'd tell a friend to buy — dice you can trust, felt to learn the layout, books with honest math.",
  books_h:"The bookshelf",
  books_d:"Three books, zero nonsense. These are the honest-math foundations behind everything on this site.",
  gear_cta:"Check price on Amazon",
  amz_disc:"As an Amazon Associate, Craps Lab earns from qualifying purchases. Prices change — the link always shows the live price.",
  merch_h:"Craps Lab merch",
  merch_d:"Branded tees and felt swag, printed on demand. Designs are in the works — check back soon.",
  merch_soon:"Designs coming soon",
  merch_notify:"Want first dibs? The announcement will go out with the next site update.",
});
Object.assign(I18N.zh,{
  gear_title:"裝備與周邊",
  gear_intro:"我真心推薦的練習裝備，以及即將推出的 Craps Lab 周邊。這裡沒有賭場或博彩公司聯盟行銷——牌照風險我不需要，而你也不該相信拿賭場錢的「策略網站」。",
  gear_h:"練習裝備",
  gear_d:"精挑細選。下面每樣都是我會推薦朋友買的——信得過的骰子、學版面的桌布、數學誠實的書。",
  books_h:"書架",
  books_d:"三本書，零廢話。這些是本站所有內容背後的誠實數學基礎。",
  gear_cta:"去 Amazon 看價格",
  amz_disc:"身為 Amazon 合作夥伴，Craps Lab 從合格購買中賺取佣金。價格會變動——連結永遠顯示即時價格。",
  merch_h:"Craps Lab 周邊",
  merch_d:"品牌 T 恤與桌布小物，按需印製。設計製作中——敬請期待。",
  merch_soon:"設計即將推出",
  merch_notify:"想搶先入手？會在下次網站更新時一併公告。",
});
function pick(o){ return (LANG==='zh'?o.zh:o.en)||o.en; }
function bookCard(b){
  return `<div class="book-card">
    <img src="${b.cover}" alt="${pick(b.name)} — ${pick(b.author)}" class="book-cover" loading="lazy">
    <div class="book-info">
      <h3>${b.icon} ${pick(b.name)}</h3>
      <p class="book-author">${pick(b.author)}</p>
      <p>${pick(b.d)}</p>
      <a href="${amz(b.q)}" target="_blank" rel="nofollow sponsored noopener">${t('gear_cta')} →</a>
    </div>
  </div>`;
}
function gearCard(g){
  return `<div class="book-card">
    <div class="gear-icon">${g.icon}</div>
    <div class="book-info">
      <h3>${pick(g.name)}</h3>
      <p>${pick(g.d)}</p>
      <a href="${amz(g.q)}" target="_blank" rel="nofollow sponsored noopener">${t('gear_cta')} →</a>
    </div>
  </div>`;
}
function renderGear(){
  document.getElementById('bookgrid').innerHTML = BOOKS.map(bookCard).join('');
  document.getElementById('geargrid').innerHTML = GEAR_ITEMS.map(gearCard).join('');
  const m = document.getElementById('merchgrid');
  if(!MERCH_PRODUCTS.length){
    m.innerHTML = [1,2,3].map(()=>`
      <div class="card" style="border-style:dashed;text-align:center;opacity:.75">
        <div style="font-size:2.2rem">👕</div>
        <h3 style="color:var(--gold)">${t('merch_soon')}</h3>
        <p class="muted">${t('merch_notify')}</p>
      </div>`).join('');
  } else {
    m.innerHTML = MERCH_PRODUCTS.map(p=>`
      <div class="card"><img src="${p.img}" alt="" style="width:100%;border-radius:8px">
        <h3 style="color:var(--gold);margin:8px 0">${pick(p.name)}</h3>
        <div class="kv"><span>Price</span><b>${p.price}</b></div>
        <a class="btn small" href="${p.url}" target="_blank" rel="noopener">Buy →</a>
      </div>`).join('');
  }
}
function onLangChange(){ renderGear(); }
</script>
<style>
.book-card{display:flex;gap:22px;align-items:flex-start;background:var(--card,#1a1a1a);border:1px solid var(--line,#333);border-radius:14px;padding:22px;margin-bottom:18px}
.book-cover{width:130px;flex-shrink:0;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.4)}
.book-info{flex:1;min-width:0}
.book-info h3{margin:0 0 4px;font-size:1.15rem;color:var(--gold)}
.book-author{color:var(--muted,#999);font-size:.88rem;margin:0 0 10px;font-style:italic}
.book-info p{margin:0 0 12px;line-height:1.6}
.book-info a{font-weight:700;color:var(--gold)}
.gear-icon{font-size:3rem;flex-shrink:0;width:130px;text-align:center;padding-top:8px}
.merch-note{font-size:.82rem;color:var(--cream-dim);border:1px dashed var(--line);border-radius:8px;padding:10px 14px;margin:10px 0}
@media(max-width:640px){.book-card{flex-direction:column;gap:14px}.book-cover{width:110px}.gear-icon{width:auto}}
</style>
</head>
<body>
<script>document.write(navHTML('gear.html'));</script>
<div class="wrap"><section class="block">
<h1 style="color:var(--gold)" data-i18n="gear_title">Gear & Merch</h1>
<p data-i18n="gear_intro"></p>

<h2 class="sec">📚 <span data-i18n="books_h">The bookshelf</span></h2>
<p class="muted" data-i18n="books_d"></p>
<div id="bookgrid"></div>

<h2 class="sec mt">🛒 <span data-i18n="gear_h">Practice gear</span></h2>
<p class="muted" data-i18n="gear_d"></p>
<div id="geargrid"></div>
<p class="ad-note" data-i18n="amz_disc"></p>

<h2 class="sec mt">👕 <span data-i18n="merch_h">Craps Lab merch</span></h2>
<p class="muted" data-i18n="merch_d"></p>
<div class="grid cols3" id="merchgrid"></div>

<script>document.write(disclosure());</script>
</section></div>
<script>document.write(adSlot());</script>
<script>document.write(footerHTML());</script>
<script>renderGear();</script>
</body>
</html>
