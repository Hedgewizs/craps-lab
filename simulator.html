<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Craps Lab — Full-Table Simulator</title>
<meta name="description" content="Interactive craps simulator: every bet on a modern table including crapless, working/off toggles, strategy presets, bankroll chart. Free, bilingual.">
<link rel="stylesheet" href="styles.css">
<style>
/* ---------- interactive craps table (wide single-end, Crapsee-style) ---------- */
.sim-wide{width:100vw;margin-left:calc(50% - 50vw);padding:0 14px;box-sizing:border-box}
body{overflow-x:clip}
.sim-controlbar{position:sticky;bottom:10px;z-index:60;margin:14px 0 0;padding:12px 16px;box-shadow:0 -6px 26px rgba(0,0,0,.55),0 10px 26px rgba(0,0,0,.55)}
.sim-ctl-row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;width:100%}
.sim-ctl-left{min-width:180px}
.sim-ctl-btns{display:flex;gap:10px;align-items:center}
.sim-dice{margin:0!important}
.sim-dice .die{width:46px;height:46px;border-radius:9px}
.sim-dice .die svg{width:34px;height:34px}
.sim-controlbar .stat-grid{width:100%;max-width:none;grid-template-columns:repeat(4,1fr);margin:10px 0 0}
.sim-controlbar .stat{padding:8px 12px}
.sim-controlbar .stat .v{font-size:1.1rem}
.ct-diepop{animation:ctpop .35s ease}
@keyframes ctpop{0%{transform:scale(.6) rotate(-14deg)}60%{transform:scale(1.15) rotate(6deg)}100%{transform:scale(1)}}
.ct-wrap{margin:18px 0}
.ct-tablescroll{overflow-x:auto;padding-bottom:6px}
.ct-felt{background:radial-gradient(ellipse at 50% 25%,#0e6b46,#07271e 85%);border:3px solid #6b4f1d;border-radius:22px;padding:16px;user-select:none;min-width:960px;display:flex;flex-direction:column;gap:12px}
.ct-toprow{display:grid;grid-template-columns:1fr 92px;gap:10px}
.ct-place-row{display:flex;gap:8px}
.ct-numbox{flex:1;display:flex;flex-direction:column;border:1px solid rgba(212,175,55,.45);border-radius:10px;overflow:hidden;background:rgba(0,0,0,.22)}
.ct-lay{background:rgba(0,0,0,.45);color:var(--gold);font-weight:800;font-size:.72rem;letter-spacing:1px;text-align:center;padding:6px 0;cursor:pointer;border-bottom:1px solid rgba(212,175,55,.35)}
.ct-lay:hover{background:rgba(212,175,55,.25)}
.ct-num{border:0;border-radius:0;background:transparent;min-height:96px}
.ct-num.is-point{box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 22px rgba(212,175,55,.35)}
.ct-num .ct-zlabel{font-size:1.7rem;color:var(--gold)}
.ct-num.is-point .ct-zlabel{color:#fff}
.ct-pb{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid rgba(212,175,55,.35)}
.ct-pb span{padding:9px 0;text-align:center;cursor:pointer;font-weight:800;font-size:.78rem;letter-spacing:1px;color:var(--cream)}
.ct-pb span:first-child{border-right:1px solid rgba(212,175,55,.35)}
.ct-pb span:hover{background:rgba(212,175,55,.25)}
.ct-dccol{display:flex;flex-direction:column;gap:8px}
.ct-dontcome{flex:1;min-height:120px}
.ct-dontcome .ct-zlabel{color:#c0392b;letter-spacing:2px}
.ct-vert{writing-mode:vertical-rl}
.ct-red{color:#c0392b!important}
.ct-botrow{display:grid;grid-template-columns:320px 330px 1fr;gap:12px}
.ct-panel{border:1px solid rgba(212,175,55,.35);border-radius:12px;padding:10px;background:rgba(0,0,0,.22);display:flex;flex-direction:column;gap:8px}
.ct-paneltitle{color:var(--gold);font-weight:800;font-size:.82rem;letter-spacing:2px;text-align:center}
.ct-hardgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ct-hardbox{min-height:86px}
.ct-dicepair{display:flex;gap:6px;pointer-events:none}
.ct-dicepair .ct-minidie{width:30px;height:30px}
.ct-hardlab{color:var(--cream-dim);font-size:.68rem;margin-top:4px;pointer-events:none}
.ct-bigrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ct-hopgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ct-hopbox{min-height:78px}
.ct-propsrow2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ct-bands{display:flex;flex-direction:column;gap:8px}
.ct-come{min-height:96px;border-width:2px}
.ct-come .ct-zlabel{font-size:2rem;letter-spacing:6px;color:var(--gold)}
.ct-field{min-height:76px}
.ct-fieldnums{display:flex;justify-content:space-around;width:100%;color:var(--gold);font-weight:800;font-size:1rem;pointer-events:none;margin-bottom:4px}
.ct-fcirc{width:30px;height:30px;border:2px solid var(--cream);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.85rem}
.ct-field .ct-zlabel{font-size:1.05rem;letter-spacing:4px}
.ct-dontpass{min-height:52px}
.ct-dontpass .ct-zlabel{font-size:1rem;letter-spacing:3px}
.ct-pass{min-height:80px;border:3px solid rgba(212,175,55,.7)}
.ct-pass .ct-zlabel{font-size:1.6rem;letter-spacing:8px}
/* zone basics */
.ct-zone{position:relative;border:1px dashed rgba(212,175,55,.55);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:8px 4px;background:rgba(0,0,0,.18);text-align:center;transition:background .15s}
.ct-zone:hover{background:rgba(212,175,55,.22)}
.ct-zone.has-bet{border-style:solid;border-color:var(--gold);background:rgba(212,175,55,.12)}
.ct-zone.is-point{border:2px solid var(--gold);box-shadow:0 0 14px rgba(212,175,55,.5)}
.ct-zlabel{color:var(--cream);font-weight:800;font-size:.82rem;letter-spacing:.5px;pointer-events:none}
.ct-sub{color:var(--cream-dim);font-size:.68rem;pointer-events:none}
.ct-odds{color:var(--gold-dim);font-size:.68rem;pointer-events:none}
.ct-chips{position:absolute;top:4px;right:6px;display:flex;align-items:center;pointer-events:none}
.ct-chip{width:22px;height:22px;border-radius:50%;border:2px dashed #fff;margin-left:-10px;box-shadow:0 2px 4px rgba(0,0,0,.5)}
.ct-chip.c0{background:#e05252}.ct-chip.c1{background:#5aa9e6}.ct-chip.c2{background:#4caf7d}.ct-chip.c3{background:#1a1a1a}
.ct-amt{background:var(--gold);color:#1a1a1a;font-size:.68rem;font-weight:800;border-radius:999px;padding:1px 8px;margin-left:4px}
.ct-puck{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;font-weight:800;font-size:.8rem}
.ct-puck.on{background:#f5f0e1;color:#1a1a1a;border:3px solid #1a1a1a}
.ct-puck.off{background:#1a1a1a;color:var(--cream-dim);border:3px solid var(--cream-dim)}
.ct-puckslot{display:flex;justify-content:center;margin-top:4px;min-height:46px;align-items:center;pointer-events:none}
.ct-puckbox{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px dashed rgba(212,175,55,.35);border-radius:10px;min-height:120px}
.ct-hopctl{display:flex;gap:4px;margin-top:4px;pointer-events:auto}
.ct-hopctl select{background:#0a3529;border:1px solid var(--line);color:var(--cream);border-radius:6px;padding:4px;font-size:.85rem}
.ct-hopgo{background:var(--gold);border:none;border-radius:6px;padding:4px 10px;font-weight:800;cursor:pointer}
.ct-hopzone{cursor:default}
/* chip rack + quick controls */
.ct-rackbar{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px;padding:14px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:14px}
.ct-chipbar-label{color:var(--gold);font-weight:700;font-size:.9rem}
.ct-chipbtn{width:62px;height:62px;border-radius:50%;border:4px dashed rgba(255,255,255,.85);color:#fff;font-weight:800;font-size:.82rem;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.5)}
.ct-chipbtn[data-chip="5"]{background:#c0392b}
.ct-chipbtn[data-chip="10"]{background:#2980b9}
.ct-chipbtn[data-chip="25"]{background:#27ae60}
.ct-chipbtn[data-chip="100"]{background:#2c3e50}
.ct-chipbtn[data-chip="500"]{background:#8e44ad}
.ct-chipbtn.active{outline:3px solid var(--gold);box-shadow:0 0 16px rgba(212,175,55,.7)}
.ct-custom{background:#0a3529;border:1px solid var(--line);color:var(--cream);border-radius:8px;padding:8px 10px;width:100px;font-size:.95rem}
.ct-racksep{width:1px;align-self:stretch;background:var(--line)}
/* roll distribution */
.ct-dist{display:flex;gap:6px;align-items:flex-end;padding:10px;background:#04150f;border:1px solid var(--line);border-radius:10px;min-height:80px}
.ct-distcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.ct-distbar{width:70%;max-width:34px;background:linear-gradient(180deg,var(--gold),#8a6d1f);border-radius:4px 4px 0 0}
.ct-distn{color:var(--gold);font-size:.72rem;font-weight:700;min-height:14px}
.ct-distl{color:var(--cream-dim);font-size:.78rem}
/* roll history */
.ct-histwrap{margin-top:14px}
.ct-histhead{color:var(--gold);font-weight:700;margin-bottom:8px;font-size:.95rem}
.ct-history{display:flex;gap:8px;overflow-x:auto;padding:10px;background:#04150f;border:1px solid var(--line);border-radius:10px;min-height:76px}
.ct-roll{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:8px;padding:6px 8px}
.ct-roll.made{border-color:var(--green);box-shadow:0 0 8px rgba(76,175,125,.4)}
.ct-roll.sevenout{border-color:var(--red);box-shadow:0 0 8px rgba(224,82,82,.4)}
.ct-roll-dice{display:flex;gap:2px}
.ct-minidie{width:22px;height:22px;background:var(--cream);border-radius:4px}
.ct-roll-total{font-weight:800;color:var(--gold);font-size:.85rem;margin-top:2px}
.ct-handstats{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-size:.9rem;color:var(--cream-dim)}
.ct-handstats b{color:var(--gold)}
@media(max-width:700px){
  .ct-botrow{grid-template-columns:1fr}
  .ct-num .ct-zlabel{font-size:1.3rem}
  .sim-controlbar .stat-grid{grid-template-columns:repeat(2,1fr)}
  .sim-controlbar{bottom:6px;padding:10px 12px}
  .sim-ctl-left{min-width:0}
}
</style>
<script src="i18n.js"></script>
<script src="craps-engine.js"></script>
<script src="table.js"></script>
<script>
Object.assign(I18N.en,{
  sim_title:"Full-Table Simulator", sim_intro:"Every bet on a modern layout — place them yourself or load a strategy preset, then roll. The dice are two independent d6; the math is the real math.",
  preset:"Strategy preset", preset_manual:"Manual (I'll place bets)",
  place_bets:"Place bets", active_bets:"Active bets", no_bets:"No bets up.",
  working:"working", off:"OFF", take_down:"take down",
  roll_history:"Roll history", stats:"Session stats",
  decisions:"decisions", theo_loss:"theoretical loss", peak:"peak", trough:"trough",
  new_session:"New session", auto_roll:"Auto roll", stop:"Stop",
  point_on:"Point ON", shooter:"Shooter",
  bet_placed:"bet placed", invalid:"Invalid",
  goal_hit:"WIN GOAL HIT", ruined:"RUINED / STOP-LOSS",
  last_roll:"Last roll", total:"Total",
});
Object.assign(I18N.zh,{
  sim_title:"全桌模擬器", sim_intro:"現代賭桌上的每種注——自己下，或載入策略預設，然後擲骰。骰子是兩顆獨立 d6；數學就是真實數學。",
  preset:"策略預設", preset_manual:"手動（我自己下注）",
  place_bets:"下注", active_bets:"場上注碼", no_bets:"目前沒有注。",
  working:"生效中", off:"關閉", take_down:"收回",
  roll_history:"擲骰紀錄", stats:"Session 統計",
  decisions:"次結算", theo_loss:"理論損失", peak:"最高", trough:"最低",
  new_session:"新 session", auto_roll:"自動擲骰", stop:"停止",
  point_on:"點數確立", shooter:"擲骰者",
  bet_placed:"已下注", invalid:"無效",
  goal_hit:"達到停利目標", ruined:"破產 / 觸及停損",
  last_roll:"上次擲骰", total:"總和",
});
let eng=null, stratMem={}, autoTimer=null, equity=[];
const PRESETS = ()=>Object.keys(STRATEGIES);
function pickLang(o){ return (LANG==='zh'?o.zh:o.en)||o.en; }

function newSession(){
  const o = {
    bankroll:+document.getElementById('s_bank').value||500,
    winGoal:+document.getElementById('s_goal').value||0,
    stopLoss:+document.getElementById('s_stop').value||0,
    tableMin:+document.getElementById('s_min').value||5,
    tableMax:+document.getElementById('s_max').value||1000,
    oddsMax:document.getElementById('s_odds').value,
    fieldPay:document.getElementById('s_field').value,
    fieldTriple:+document.getElementById('s_triple').value||12,
    buyVig:document.getElementById('s_vig').value,
    crapless:document.getElementById('s_crapless').checked,
    seed:(Math.random()*1e9)|0,
  };
  if(o.oddsMax==='345') o.oddsMax='345';
  eng = new CrapsEngine(o);
  eng.startBankroll = eng.bankroll;
  stratMem = {};
  equity = [eng.bankroll];
  if(typeof ctResetStats==='function') ctResetStats();
  document.getElementById('log').innerHTML='';
  document.getElementById('preset').value='manual';
  stopAuto();
  renderAll();
  log('Session started: $'+eng.bankroll+' bankroll.');
}
function applyPreset(){
  const id = document.getElementById('preset').value;
  if(id==='manual'||!eng) return;
  stratMem={};
  log('Preset loaded: '+sname(id));
  renderAll();
}
function doRoll(){
  if(!eng) return;
  const preset=document.getElementById('preset').value;
  if(preset!=='manual' && STRATEGIES[preset]){
    try{ STRATEGIES[preset].fn(eng,stratMem); }catch(e){ log('Preset: '+e.message); }
  }
  window._ctLastBets = eng.bets.filter(b=>!b.parentId).map(b=>({type:b.type, params:Object.assign({amount:b.amount}, b.number?{number:b.number}:{}, b.type==='hop'?{d1:b.meta.d1, d2:b.meta.d2, hard:b.meta.hard}:{})}));
  const ev = eng.roll();
  const r = ev.find(e=>e.t==='roll');
  equity.push(eng.bankroll);
  if(equity.length>400) equity.shift();
  if(typeof ctRecordRoll==='function') ctRecordRoll(ev);
  renderAll(r);
  const goal=+document.getElementById('s_goal').value||0;
  const stop=+document.getElementById('s_stop').value||0;
  if(goal>0 && eng.bankroll-eng.startBankroll>=goal){ log('🎯 '+t('goal_hit')); stopAuto(); }
  if(eng.bankroll<=0 || (stop>0 && eng.startBankroll-eng.bankroll>=stop)){ log('🛑 '+t('ruined')); stopAuto(); }
}
function placeBetUI(type, params){
  if(!eng) return;
  try{
    const b=eng.placeBet(type,params||{});
    log('+ '+betName(b)+' $'+b.amount+' '+t('bet_placed'));
  }catch(e){ log('⚠️ '+t('invalid')+': '+e.message); }
  renderAll();
}
function betName(b){
  const n=b.number?(' '+b.number):'';
  return b.type+n;
}
function toggleWork(id){
  const b=eng.bets.find(x=>x.id===id); if(!b) return;
  b.working=!b.working; log(betName(b)+' → '+(b.working?t('working'):t('off')));
  renderAll();
}
function takeDown(id){ if(eng){ eng.removeBet(id); renderAll(); } }
function clearBets(){ if(eng){ eng.clearBets(); renderAll(); } }
function newShooter(){ if(eng){ eng.newShooter(); log('🎲 '+t('new_shooter')); renderAll(); } }
function toggleAuto(){
  if(autoTimer){ stopAuto(); return; }
  autoTimer=setInterval(doRoll, 350);
  document.getElementById('autobtn').textContent=t('stop');
}
function stopAuto(){ if(autoTimer){clearInterval(autoTimer);autoTimer=null;} const b=document.getElementById('autobtn'); if(b) b.textContent=t('auto_roll'); }
function log(m){ const el=document.getElementById('log'); el.innerHTML='<div>'+m+'</div>'+el.innerHTML; }
function dieSVG(v){
  const p={1:[50,50],2:[30,30,70,70],3:[30,30,50,50,70,70],4:[32,32,68,32,32,68,68,68],5:[32,32,68,32,50,50,32,68,68,68],6:[32,28,68,28,32,50,68,50,32,72,68,72]}[v];
  let c=''; for(let i=0;i<p.length;i+=2) c+=`<circle cx="${p[i]}" cy="${p[i+1]}" r="9" fill="#1a1a1a"/>`;
  return `<svg viewBox="0 0 100 100">${c}</svg>`;
}
function renderAll(lastRoll){
  if(!eng) return;
  // dice
  const ld1 = lastRoll? lastRoll.d1 : 1, ld2 = lastRoll? lastRoll.d2 : 1;
  document.getElementById('dice').innerHTML =
    `<div class="die ct-diepop">${dieSVG(ld1)}</div><div class="die ct-diepop">${dieSVG(ld2)}</div>`;
  document.getElementById('total').textContent = lastRoll? (t('total')+': '+lastRoll.total) : '';
  // phase
  const ph = eng.phase==='comeout' ? '⚫ '+t('comeout') : '🟡 '+t('point_on')+': '+eng.point;
  document.getElementById('phase').innerHTML = ph+' &nbsp;·&nbsp; 🎲 '+t('shooter')+' #'+eng.shooters;
  // bankroll
  const pl = eng.bankroll-eng.startBankroll;
  document.getElementById('bank').innerHTML =
    `<div class="stat"><div class="v">$${eng.bankroll.toFixed(0)}</div><div class="l">${t('bankroll_now')}</div></div>
     <div class="stat"><div class="v ${pl>=0?'pos':'neg'}">${pl>=0?'+':''}$${pl.toFixed(0)}</div><div class="l">P&amp;L</div></div>
     <div class="stat"><div class="v">${eng.decisions}</div><div class="l">${t('decisions')}</div></div>
     <div class="stat"><div class="v neg">-$${eng.theoretical.toFixed(2)}</div><div class="l">${t('theo_loss')}</div></div>`;
  // bets
  const bl=document.getElementById('betlist');
  if(!eng.bets.length) bl.innerHTML='<p class="muted">'+t('no_bets')+'</p>';
  else bl.innerHTML='<table class="data"><tr><th>Bet</th><th class="num">$</th><th></th><th></th></tr>'+
    eng.bets.map(b=>`<tr><td>${betName(b)}${b.meta&&b.meta.traveling?' ✈️':''}</td><td class="num">${b.amount}</td>
      <td>${['place','buy','hardway'].includes(b.type)?`<button class="btn small ghost" onclick="toggleWork(${b.id})">${b.working?t('working'):t('off')}</button>`:''}</td>
      <td><button class="btn small ghost" onclick="takeDown(${b.id})">${t('take_down')}</button></td></tr>`).join('')+'</table>';
  drawChart();
  if(typeof renderTable==='function') renderTable();
  if(typeof renderHistory==='function') renderHistory();
}
function drawChart(){
  const c=document.getElementById('chart'); if(!c||equity.length<2) return;
  const ctx=c.getContext('2d'); const W=c.width=c.offsetWidth*2, H=c.height=520;
  ctx.clearRect(0,0,W,H);
  const min=Math.min(...equity,eng.startBankroll), max=Math.max(...equity,eng.startBankroll);
  const rg=(max-min)||1;
  const X=i=>i/(equity.length-1)*W, Y=v=>H-20-((v-min)/rg)*(H-40);
  ctx.strokeStyle='#d4af37'; ctx.lineWidth=3; ctx.beginPath();
  equity.forEach((v,i)=> i?ctx.lineTo(X(i),Y(v)):ctx.moveTo(X(0),Y(v)));
  ctx.stroke();
  ctx.strokeStyle='rgba(212,175,55,.35)'; ctx.setLineDash([8,8]); ctx.beginPath();
  ctx.moveTo(0,Y(eng.startBankroll)); ctx.lineTo(W,Y(eng.startBankroll)); ctx.stroke(); ctx.setLineDash([]);
}
function buildBetButtons(){
  const c=document.getElementById('betbtns');
  const nums=[4,5,6,8,9,10];
  const craplessNums=[2,3,4,5,6,8,9,10,11,12];
  let h='<div class="card"><h3 style="color:var(--gold);margin-top:0">📥 '+t('place_bets')+'</h3>';
  h+='<div class="rowflex" style="margin-bottom:10px"><label class="f">Line $ <input type="number" id="b_line" value="10" style="width:90px"></label>'+
     '<button class="btn small" onclick="placeBetUI(\'pass\',{amount:+document.getElementById(\'b_line\').value})">Pass</button>'+
     '<button class="btn small ghost" onclick="placeBetUI(\'dontpass\',{amount:+document.getElementById(\'b_line\').value})">Don\'t Pass</button></div>';
  h+='<div class="rowflex" style="margin-bottom:10px"><label class="f">Come $ <input type="number" id="b_come" value="10" style="width:90px"></label>'+
     '<button class="btn small" onclick="placeBetUI(\'come\',{amount:+document.getElementById(\'b_come\').value})">Come</button>'+
     '<button class="btn small ghost" onclick="placeBetUI(\'dontcome\',{amount:+document.getElementById(\'b_come\').value})">Don\'t Come</button></div>';
  h+='<div class="rowflex" style="margin-bottom:10px"><label class="f">Place $ <input type="number" id="b_place" value="12" style="width:90px"></label><select id="b_placen">'+
     nums.map(n=>`<option>${n}</option>`).join('')+'</select>'+
     '<button class="btn small" onclick="placeBetUI(\'place\',{amount:+document.getElementById(\'b_place\').value,number:+document.getElementById(\'b_placen\').value})">Place</button></div>';
  h+='<div class="rowflex" style="margin-bottom:10px"><label class="f">Buy/Lay $ <input type="number" id="b_buy" value="20" style="width:90px"></label><select id="b_buyn">'+
     [4,10].map(n=>`<option>${n}</option>`).join('')+'</select>'+
     '<button class="btn small" onclick="placeBetUI(\'buy\',{amount:+document.getElementById(\'b_buy\').value,number:+document.getElementById(\'b_buyn\').value})">Buy</button>'+
     '<button class="btn small ghost" onclick="placeBetUI(\'lay\',{amount:+document.getElementById(\'b_buy\').value,number:+document.getElementById(\'b_buyn\').value})">Lay</button></div>';
  h+='<div class="rowflex" style="margin-bottom:10px"><label class="f">Hardway $ <input type="number" id="b_hard" value="5" style="width:90px"></label><select id="b_hardn">'+
     [4,6,8,10].map(n=>`<option>${n}</option>`).join('')+'</select>'+
     '<button class="btn small" onclick="placeBetUI(\'hardway\',{amount:+document.getElementById(\'b_hard\').value,number:+document.getElementById(\'b_hardn\').value})">Hardway</button></div>';
  h+='<div class="rowflex" style="margin-bottom:10px"><label class="f">Prop $ <input type="number" id="b_prop" value="5" style="width:90px"></label>'+
     '<button class="btn small" onclick="placeBetUI(\'anyseven\',{amount:+document.getElementById(\'b_prop\').value})">Any 7</button>'+
     '<button class="btn small" onclick="placeBetUI(\'anycraps\',{amount:+document.getElementById(\'b_prop\').value})">Any Craps</button>'+
     '<button class="btn small" onclick="placeBetUI(\'horn\',{amount:4*Math.max(1,Math.round(+document.getElementById(\'b_prop\').value/4))})">Horn</button>'+
     '<button class="btn small" onclick="placeBetUI(\'field\',{amount:+document.getElementById(\'b_prop\').value})">Field</button>'+
     '<button class="btn small" onclick="placeBetUI(\'ce\',{amount:2*Math.max(1,Math.round(+document.getElementById(\'b_prop\').value/2))})">C&amp;E</button>'+
     '<button class="btn small" onclick="placeBetUI(\'big68\',{amount:+document.getElementById(\'b_prop\').value,number:6})">Big 6</button>'+
     '<button class="btn small" onclick="placeBetUI(\'big68\',{amount:+document.getElementById(\'b_prop\').value,number:8})">Big 8</button></div>';
  h+='<div class="rowflex"><label class="f">Bonus $ <input type="number" id="b_bonus" value="5" style="width:90px"></label>'+
     '<button class="btn small" onclick="placeBetUI(\'ats\',{amount:+document.getElementById(\'b_bonus\').value,side:\'all\'})">ATS All</button>'+
     '<button class="btn small" onclick="placeBetUI(\'ats\',{amount:+document.getElementById(\'b_bonus\').value,side:\'tall\'})">ATS Tall</button>'+
     '<button class="btn small" onclick="placeBetUI(\'ats\',{amount:+document.getElementById(\'b_bonus\').value,side:\'small\'})">ATS Small</button>'+
     '<button class="btn small" onclick="placeBetUI(\'fire\',{amount:+document.getElementById(\'b_bonus\').value})">Fire</button>'+
     '<button class="btn small" onclick="placeBetUI(\'repeater\',{amount:+document.getElementById(\'b_bonus\').value,number:6})">Repeater 6</button></div>';
  h+='<div class="rowflex mt"><button class="btn small danger" onclick="clearBets()">'+t('clear_bets')+'</button>'+
     '<button class="btn small ghost" onclick="newShooter()">'+t('new_shooter')+'</button></div>';
  h+='</div>';
  c.innerHTML=h;
}
function sname(k){ const n=STRATEGIES[k].name; return (typeof n==='object')?(LANG==='zh'?n.zh:n.en):n; }
function onLangChange(){ buildBetButtons(); buildPresets(); if(typeof buildTable==='function') buildTable(); if(eng) renderAll(); }
function buildPresets(){
  const s=document.getElementById('preset');
  s.innerHTML=`<option value="manual">${t('preset_manual')}</option>`+
    Object.keys(STRATEGIES).map(k=>`<option value="${k}">${sname(k)}</option>`).join('');
}
