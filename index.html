<script>
// hero dice animation
function dieSVG(v){
  const p={1:[50,50],2:[30,30,70,70],3:[30,30,50,50,70,70],4:[30,30,70,30,30,70,70,70],5:[30,30,70,30,50,50,30,70,70,70],6:[30,30,70,30,30,50,70,50,30,70,70,70]}[v];
  let c='';for(let i=0;i<p.length;i+=2)c+=`<circle cx="${p[i]}" cy="${p[i+1]}" r="8" fill="#1a1a1a"/>`;
  return `<svg viewBox="0 0 100 100">${c}</svg>`;
}
const hd=document.getElementById('heroDice');
function heroRoll(){const a=1+Math.floor(Math.random()*6),b=1+Math.floor(Math.random()*6);
  hd.innerHTML=`<div class="die">${dieSVG(a)}</div><div class="die">${dieSVG(b)}</div>`;}
heroRoll();setInterval(heroRoll,1600);
