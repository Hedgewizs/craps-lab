function bankOK(b){ return (typeof b !== "undefined") && Array.isArray(b) && b.length > 0 && b[0] && b[0].q && b[0].choices; }

/* ---------- tiny helpers ---------- */
function L(o){ return (LANG === "zh" ? o.zh : o.en) || o.en; }
function shuffle(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--){ var j = Math.floor(Math.random() * (i + 1)); var x = a[i]; a[i] = a[j]; a[j] = x; } return a; }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function store(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch (e){} }
function read(k){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e){ return null; } }

/* ---------- 1. Payout quiz ---------- */
var quiz = { active:false, order:[], idx:0, score:0 };
function startQuiz(){
  var n = Math.min(10, QUIZ.length);
  quiz = { active:true, idx:0, score:0, order: shuffle(QUIZ).slice(0, n).map(function(it){
    var idxs = []; for (var i = 0; i < it.choices.length; i++) idxs.push(i);
    return { it: it, order: shuffle(idxs), picked: -1 };
  })};
  renderQuiz();
}
function renderQuiz(){
  var box = $("quizBox"); if (!box) return;
  var html = "";
  if (!quiz.active){
    var best = read("crapslab_quiz_best");
    html = '<div class="card center"><p class="big">' + esc(t("quiz_d")) + '</p>' +
      (best ? '<p class="muted">' + esc(t("quiz_best")) + ': <b>' + best.score + "/" + best.total + '</b></p>' : "") +
      '<button class="btn" onclick="startQuiz()">' + esc(t("quiz_start")) + '</button></div>';
  } else if (quiz.idx >= quiz.order.length){
    var pct = Math.round(100 * quiz.score / quiz.order.length);
    var best2 = read("crapslab_quiz_best");
    html = '<div class="card center"><h3>🏁 ' + esc(t("quiz_done_h")) + '</h3>' +
      '<p class="big">' + quiz.score + " / " + quiz.order.length + ' <span class="muted">(' + pct + '%)</span></p>' +
      (best2 ? '<p class="muted">' + esc(t("quiz_best")) + ': <b>' + best2.score + "/" + best2.total + '</b></p>' : "") +
      '<button class="btn" onclick="startQuiz()">' + esc(t("quiz_again")) + '</button></div>';
  } else {
    var cur = quiz.order[quiz.idx], it = cur.it, i, ci, cls, dis;
    html = '<div class="card"><div class="kv"><span><b>Q ' + (quiz.idx + 1) + " / " + quiz.order.length + '</b></span><span>' +
      esc(t("quiz_score")) + ': <b>' + quiz.score + '</b></span></div>' +
      '<p class="big">' + esc(L(it.q)) + '</p>';
    for (i = 0; i < cur.order.length; i++){
      ci = cur.order[i]; cls = "quiz-opt"; dis = "";
      if (cur.picked >= 0){ dis = " disabled"; cls += (ci === it.answer) ? " right" : (i === cur.picked ? " wrong" : ""); }
      html += '<button class="' + cls + '"' + dis + ' onclick="answerQuiz(' + i + ')">' + esc(L(it.choices[ci])) + '</button>';
    }
    if (cur.picked >= 0){
      var ok = cur.order[cur.picked] === it.answer;
      html += '<div class="callout"><b>' + (ok ? "✓" : "✗") + '</b> ' + esc(L(it.explain)) +
        '<br>💡 <i>' + esc(L(it.tip)) + '</i></div>' +
        '<button class="btn small" onclick="nextQuiz()">' + esc(quiz.idx + 1 >= quiz.order.length ? t("quiz_results") : t("quiz_next")) + '</button>';
    }
    html += '</div>';
  }
  box.innerHTML = html;
}
function answerQuiz(i){
  var cur = quiz.order[quiz.idx];
  if (!cur || cur.picked >= 0) return;
  cur.picked = i;
  if (cur.order[i] === cur.it.answer) quiz.score++;
  renderQuiz();
}
function nextQuiz(){
  quiz.idx++;
  if (quiz.idx >= quiz.order.length){
    var best = read("crapslab_quiz_best");
    if (!best || quiz.score > best.score) store("crapslab_quiz_best", { score: quiz.score, total: quiz.order.length });
  }
  renderQuiz();
}

/* ---------- 2. Click-to-place layout trainer ---------- */
/* pos = [left%, top%, width%, height%] on the felt */
var BETS = [
  {id:"pass",     name:{en:"Pass Line",zh:"過關線"},   short:{en:"PASS",zh:"過關"},   amt:10, pos:[2,87,64,11]},
  {id:"dontpass", name:{en:"Don't Pass",zh:"不過關線"}, short:{en:"DON'T",zh:"不過關"}, amt:10, pos:[2,78,64,8]},
  {id:"field",    name:{en:"Field",zh:"外圍注"},       short:{en:"FIELD",zh:"Field"}, amt:5,  pos:[2,68,64,9]},
  {id:"come",     name:{en:"Come",zh:"來注"},          short:{en:"COME",zh:"來注"},   amt:10, pos:[2,58,64,9]},
  {id:"place4",   name:{en:"Place 4",zh:"置注 4"},     short:{en:"4",zh:"4"},         amt:20, pos:[2,40,10.4,15]},
  {id:"place5",   name:{en:"Place 5",zh:"置注 5"},     short:{en:"5",zh:"5"},         amt:10, pos:[13,40,10.4,15]},
  {id:"place6",   name:{en:"Place 6",zh:"置注 6"},     short:{en:"6",zh:"6"},         amt:12, pos:[23.8,40,10.4,15]},
  {id:"place8",   name:{en:"Place 8",zh:"置注 8"},     short:{en:"8",zh:"8"},         amt:12, pos:[34.6,40,10.4,15]},
  {id:"place9",   name:{en:"Place 9",zh:"置注 9"},     short:{en:"9",zh:"9"},         amt:10, pos:[45.4,40,10.4,15]},
  {id:"place10",  name:{en:"Place 10",zh:"置注 10"},   short:{en:"10",zh:"10"},       amt:20, pos:[56.2,40,10.4,15]},
  {id:"hard4",    name:{en:"Hard 4",zh:"硬 4"},        short:{en:"H4",zh:"硬4"},      amt:5,  pos:[2,23,13,13]},
  {id:"hard6",    name:{en:"Hard 6",zh:"硬 6"},        short:{en:"H6",zh:"硬6"},      amt:5,  pos:[16.5,23,13,13]},
  {id:"hard8",    name:{en:"Hard 8",zh:"硬 8"},        short:{en:"H8",zh:"硬8"},      amt:5,  pos:[31,23,13,13]},
  {id:"hard10",   name:{en:"Hard 10",zh:"硬 10"},      short:{en:"H10",zh:"硬10"},    amt:5,  pos:[45.5,23,13,13]},
  {id:"ats",      name:{en:"All-Tall-Small",zh:"大小通吃"}, short:{en:"ATS",zh:"ATS"}, amt:5, pos:[60,23,20,13]},
  {id:"anyseven", name:{en:"Any Seven",zh:"任意七點"},  short:{en:"ANY 7",zh:"任意7"}, amt:5,  pos:[82,6,16,15]},
  {id:"horn",     name:{en:"Horn",zh:"喇叭注"},        short:{en:"HORN",zh:"喇叭"},   amt:4,  pos:[82,23,16,15]}
];
var trainer = { target:null, streak:0, hits:0, chips:[] };
function betById(id){ for (var i = 0; i < BETS.length; i++) if (BETS[i].id === id) return BETS[i]; return null; }
function newTarget(){
  var pool = BETS.filter(function(b){ return !trainer.target || b.id !== trainer.target.id; });
  trainer.target = pool[Math.floor(Math.random() * pool.length)];
}
function renderFelt(){
  var felt = $("felt"); if (!felt) return;
  var html = "", i, j, b, p;
  for (i = 0; i < BETS.length; i++){
    b = BETS[i]; p = b.pos;
    html += '<div class="lz" style="left:' + p[0] + '%;top:' + p[1] + '%;width:' + p[2] + '%;height:' + p[3] +
      '%" onclick="tapZone(\'' + b.id + '\',this)"><span class="zlab">' + esc(L(b.short)) + '</span>';
    for (j = 0; j < trainer.chips.length; j++)
      if (trainer.chips[j].id === b.id) html += '<span class="chip">$' + trainer.chips[j].amt + '</span>';
    html += '</div>';
  }
  felt.innerHTML = html;
  var show = read("crapslab_trainer_labels");
  felt.classList.toggle("hidelab", show === false);
  var tg = $("labtoggle"); if (tg) tg.checked = show !== false;
}
function renderTrainer(){
  var pr = $("tprompt"); if (!pr) return;
  if (!trainer.target) newTarget();
  var b = trainer.target;
  pr.innerHTML = esc(t("trainer_tap")).replace("{amt}", "$" + b.amt).replace("{bet}", "<b>" + esc(L(b.name)) + "</b>");
  var best = read("crapslab_trainer_best") || 0;
  $("tstreak").textContent = t("trainer_streak") + ": " + trainer.streak;
  $("tbest").textContent = t("trainer_best") + ": " + best;
  $("thits").textContent = t("trainer_hits") + ": " + trainer.hits;
  $("tclearbtn").textContent = t("trainer_clear");
  $("labt").textContent = t("trainer_labels");
}
function tapZone(id, el){
  var b = betById(id);
  if (!b || !trainer.target) return;
  if (id === trainer.target.id){
    el.classList.add("goodflash");
    trainer.chips.push({ id:id, amt:trainer.target.amt });
    var chip = document.createElement("span");
    chip.className = "chip"; chip.textContent = "$" + trainer.target.amt;
    el.appendChild(chip);
    trainer.streak++; trainer.hits++;
    var best = read("crapslab_trainer_best") || 0;
    if (trainer.streak > best) store("crapslab_trainer_best", trainer.streak);
    renderTrainer();
    setTimeout(function(){ el.classList.remove("goodflash"); newTarget(); renderTrainer(); }, 750);
  } else {
    el.classList.add("badflash");
    trainer.streak = 0;
    setTimeout(function(){ el.classList.remove("badflash"); }, 650);
    renderTrainer();
  }
}
function clearFelt(){ trainer.chips = []; renderFelt(); }
function toggleLabels(el){
  var felt = $("felt"); if (felt) felt.classList.toggle("hidelab", !el.checked);
  store("crapslab_trainer_labels", el.checked);
}

/* ---------- 3. Dealer phrase scripts ---------- */
function renderPhrases(){
  var box = $("phrasesBox"); if (!box) return;
  var html = "", i, p;
  for (i = 0; i < PHRASES.length; i++){
    p = PHRASES[i];
    html += '<div class="card"><div class="say">\u201c' + esc(L(p.say)) + '\u201d</div>' +
      '<div class="kv"><span class="muted">' + esc(t("dealer_when")) + '</span>' +
      '<span style="text-align:right;max-width:62%">' + esc(L(p.when)) + '</span></div>' +
      '<div class="kv"><span class="muted">' + esc(t("dealer_means")) + '</span>' +
      '<span style="text-align:right;max-width:62%">' + esc(L(p.means)) + '</span></div></div>';
  }
  box.innerHTML = html;
}

/* ---------- 4. Beginner mistakes checklist ---------- */
var misChecked = (function(){ var m = read("crapslab_mistakes"); return (m && typeof m === "object") ? m : {}; })();
function renderMistakes(){
  var box = $("misBox"); if (!box) return;
  var total = MISTAKES.length, done = 0, i, m;
  for (i = 0; i < total; i++) if (misChecked[i]) done++;
  var html = '<p><span class="pill">' + done + " / " + total + " " + esc(t("mis_progress")) + '</span></p><div class="card">';
  for (i = 0; i < total; i++){
    m = MISTAKES[i];
    html += '<label class="checkrow"><input type="checkbox"' + (misChecked[i] ? " checked" : "") +
      ' onchange="toggleMis(' + i + ',this)"><span><b>' + esc(L(m.t)) + '</b><br><span class="muted">' +
      esc(L(m.d)) + '</span></span></label>';
  }
  html += '</div><button class="btn small ghost" onclick="resetMis()">' + esc(t("mis_reset")) + '</button>';
  box.innerHTML = html;
}
function toggleMis(i, el){ misChecked[i] = el.checked ? 1 : 0; store("crapslab_mistakes", misChecked); renderMistakes(); }
function resetMis(){ misChecked = {}; store("crapslab_mistakes", misChecked); renderMistakes(); }

/* ---------- 1b. Dealer drills (flashcards) ---------- */
var DRILLS = (typeof DEALER_DRILLS !== "undefined" && Array.isArray(DEALER_DRILLS)) ? DEALER_DRILLS : [];
var drillFlipped = {};
function renderDrills(){
  var box = $("drillsBox"); if (!box) return;
  if (!DRILLS.length){ box.innerHTML = ""; return; }
  box.innerHTML = '<div class="grid cols2">' + DRILLS.map(function(d, i){
    var f = drillFlipped[i];
    return '<div class="card"><p><b>' + (i+1) + '.</b> ' + esc(L(d.q)) + '</p>' +
      (f ? '<div class="callout"><b>💰 ' + esc(L(d.a)) + '</b><br>💡 <i>' + esc(L(d.hint)) + '</i></div>'
         : '<button class="btn small ghost" onclick="drillFlipped[' + i + ']=1;renderDrills()">' + esc(t("drills_reveal")) + '</button>') +
      '</div>';
  }).join('') + '</div>';
}

/* ---------- language-aware re-render (called by setLang) ---------- */
function renderDynamic(){
  renderQuiz();
  renderDrills();
  renderFelt();
  renderTrainer();
  renderPhrases();
  renderMistakes();
}
renderDynamic();
</script>
